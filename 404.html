<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8"/>
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <title>404 - Sector Uncharted</title>
   <style>
      body {
         font-family: system-ui, -apple-system, sans-serif;
         background-color: #fafafa;
         color: #171717;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         height: 100vh;
         margin: 0;
         padding: 20px;
         box-sizing: border-box;
      }

      .card {
         background: #ffffff;
         padding: 40px;
         border-radius: 16px;
         box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
         border: 1px solid #eeeeee;
         max-width: 420px;
         text-align: left;
      }

      .icon {
         font-size: 2.5rem;
         margin-bottom: 20px;
      }

      h1 {
         font-size: 1.75rem;
         margin: 0 0 12px 0;
         font-weight: 700;
         letter-spacing: -0.5px;
      }

      p {
         font-size: 1rem;
         color: #525252;
         line-height: 1.6;
         margin: 0 0 32px 0;
      }

      .btn {
         display: inline-block;
         padding: 12px 20px;
         color: #ffffff;
         background-color: #171717;
         text-decoration: none;
         font-weight: 500;
         font-size: 0.95rem;
         border-radius: 8px;
         transition: transform 0.2s ease, background-color 0.2s ease;
      }

         .btn:hover {
            background-color: #404040;
            transform: translateY(-1px);
         }

         .btn:active {
            transform: translateY(0);
         }
   </style>
</head>
<body>

   <div class="card">
      <div class="icon">💥</div>
      <h1>Impressive piloting, Helmsman.</h1>
      <p>
         Unfortunately, you’ve managed to warp directly into a sector that isn't on the Starfleet charts.
         Either the subspace relays are malfunctioning, or you've decided to boldly go where we have never gone before.
      </p>
      <a href="/" class="btn">Engage impulse drive home</a>
   </div>

</body>
</html>
