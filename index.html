<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
   <meta charset="utf-8" />
   <title>mano.nz</title>
   <meta name="description" content="" />
   <meta name="keywords" content="" />
   <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <meta name="apple-mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

   <style>
      .horizonalSpin {
         animation: spinHorizontal 5s infinite linear;
      }

      @keyframes spinHorizontal {
         0% {
            transform: rotateY(0deg);
         }

         100% {
            transform: rotateY(360deg);
         }
      }

      [data-bs-theme="dark"] .navbar {
         background-color: #3d352e !important; /* Slightly darker shade for dark mode */
      }
   </style>
</head>
<body>

   <!-- Navigation Bar -->
   <nav class="navbar navbar-expand-md fixed-top" style="background-color: #eeddcc;">
      <div class="container-fluid">
         <div class="d-flex align-items-center">
            <img src="https://mano.nz/images/logo.svg" alt="logo" style="width: 40px;" class="me-2" />
         </div>

         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
         </button>

         <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
               <li class="nav-item">
                  <a class="nav-link" href="#home"></a>
               </li>
            </ul>

            <!-- Dark Mode Toggle Button inside Navbar -->
            <button class="btn btn-outline-secondary btn-sm ms-auto" id="themeToggle" type="button">
               🌙
            </button>
         </div>
      </div>
   </nav>

   <div id="home" class="container" style="margin-top: 80px;">
      <p></p>
      <img src="https://mano.nz/images/NZ-made.svg" style="width: 100%;" class="horizonalSpin" />
   </div>

   <div id="contact" class="container">
   </div>

   <hr class="border-2 border-top">

   <footer id="contact" class="container text-center">
   </footer>

   <h1>&nbsp;</h1>
   <h1>&nbsp;</h1>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

   <!-- Dark Mode Toggle Logic -->
   <script>
      const toggleBtn = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;

      toggleBtn.addEventListener('click', () => {
         const currentTheme = htmlElement.getAttribute('data-bs-theme');

         if (currentTheme === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            toggleBtn.innerHTML = '☀️';
            toggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-light');
         } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            toggleBtn.innerHTML = '🌙';
            toggleBtn.classList.replace('btn-outline-light', 'btn-outline-secondary');
         }
      });
   </script>
</body>
</html>
