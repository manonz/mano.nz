<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 143">
	<g id="engine">
		<!-- main body -->
		<rect x="4" y="63.5" width="100" height="55" rx="8"
            fill="#d94b4b" stroke="#172033" stroke-width="3"/>

		<!-- cab -->
		<rect x="22" y="18.5" width="55" height="50" rx="5"
            fill="#d94b4b" stroke="#172033" stroke-width="3"/>

		<!-- cab window -->
		<rect x="32" y="28.5" width="35" height="25"
            fill="#bde4f5" stroke="#172033" stroke-width="2"/>

		<!-- boiler -->
		<rect x="69" y="38.5" width="55" height="35" rx="15"
            fill="#d94b4b" stroke="#172033" stroke-width="3"/>

		<!-- nose -->
		<path d="M119 53.5 L139 63.5 L139 108.5 L119 118.5 Z"
            fill="#d94b4b" stroke="#172033" stroke-width="3"/>

		<!-- chimney -->
		<rect x="82" y="8.5" width="18" height="31" fill="#172033"/>
		<rect x="76" y="3.5" width="30" height="8" rx="3" fill="#172033"/>

		<!-- wheels -->
		<circle cx="29" cy="126.5" r="13" fill="#172033"/>
		<circle cx="79" cy="126.5" r="13" fill="#172033"/>
		<circle cx="122" cy="126.5" r="13" fill="#172033"/>

		<circle cx="29" cy="126.5" r="5" fill="#f7f9fc"/>
		<circle cx="79" cy="126.5" r="5" fill="#f7f9fc"/>
		<circle cx="122" cy="126.5" r="5" fill="#f7f9fc"/>
	</g>
</svg>